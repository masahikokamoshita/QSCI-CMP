[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qscicmp"
version = "1.0.0"
description = "QSCI-CMP: quantum-selected configuration interaction with chemically motivated preselection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Masahiko Kamoshita"},
  {name = "Kosuke Mitarai"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyscf>=2.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["qscicmp*"]
